<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawMatch - Checkout</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .checkout-grid { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; }
        .resumen-item { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid #2a2a4a; align-items: center; }
        .resumen-img { width: 50px; height: 50px; border-radius: 6px; background: #2a2a4a; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; overflow: hidden; }
        .resumen-img img { width: 50px; height: 50px; object-fit: cover; }
        .total-linea { display: flex; justify-content: space-between; padding: 0.5rem 0; color: #aaa; }
        .total-final { display: flex; justify-content: space-between; padding: 0.75rem 0; font-size: 1.2rem; font-weight: bold; border-top: 1px solid #2a2a4a; margin-top: 0.5rem; }
        .total-final span:last-child { color: #e94560; }
        label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 0.25rem; margin-top: 0.75rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
        .form-full { grid-column: 1 / -1; }
        .tarjeta-iconos { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tarjeta-iconos span { background: #2a2a4a; padding: 0.3rem 0.7rem; border-radius: 4px; font-size: 0.8rem; color: #aaa; }
        .demo-aviso { background: #1a2a1a; border: 1px solid #4caf50; border-radius: 8px; padding: 0.75rem 1rem; color: #4caf50; font-size: 0.85rem; margin-bottom: 1rem; }
        @media (max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<nav>
    <h1>🎮 ClawMatch</h1>
    <div style="display:flex;align-items:center;gap:1rem">
        <a href="tienda">🛍️ Tienda</a>
        <a id="link-admin" href="admin" style="display:none">⚙️ Admin</a>
        <div id="nav-avatar-container"></div>
    </div>
</nav>
<div class="container">
    <h2 style="margin-bottom:1.5rem">🛒 Finalizar compra</h2>
    <div id="mensaje" class="mensaje"></div>
    <div class="checkout-grid">
        <!-- FORMULARIO -->
        <div class="card">
            <h3 style="margin-bottom:1rem">📦 Datos de envío</h3>
            <div class="form-grid">
                <div class="form-full">
                    <label>Nombre completo *</label>
                    <input type="text" id="nombre-envio" placeholder="Tu nombre completo">
                </div>
                <div class="form-full">
                    <label>Dirección *</label>
                    <input type="text" id="direccion" placeholder="Calle, número, piso">
                </div>
                <div>
                    <label>Ciudad *</label>
                    <input type="text" id="ciudad" placeholder="Madrid">
                </div>
                <div>
                    <label>Código postal *</label>
                    <input type="text" id="cp" placeholder="28001">
                </div>
                <div>
                    <label>País *</label>
                    <input type="text" id="pais" placeholder="España">
                </div>
                <div>
                    <label>Teléfono</label>
                    <input type="text" id="tel-envio" placeholder="+34 600 000 000">
                </div>
            </div>

            <h3 style="margin:1.5rem 0 1rem">💳 Datos de pago</h3>
            <div class="demo-aviso">⚠️ Modo demo — no se realizará ningún cobro real</div>
            <div class="tarjeta-iconos">
                <span>💳 VISA</span>
                <span>💳 Mastercard</span>
                <span>💳 AMEX</span>
            </div>
            <div class="form-grid">
                <div class="form-full">
                    <label>Número de tarjeta</label>
                    <input type="text" id="num-tarjeta" placeholder="1234 5678 9012 3456" maxlength="19">
                </div>
                <div class="form-full">
                    <label>Titular</label>
                    <input type="text" id="titular" placeholder="NOMBRE APELLIDO">
                </div>
                <div>
                    <label>Expiración</label>
                    <input type="text" id="expiracion" placeholder="MM/AA" maxlength="5">
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="3">
                </div>
            </div>
        </div>

        <!-- RESUMEN -->
        <div>
            <div class="card">
                <h3 style="margin-bottom:1rem">📋 Resumen del pedido</h3>
                <div id="resumen-items">Cargando...</div>
                <div style="margin-top:1rem">
                    <div class="total-linea"><span>Subtotal</span><span id="subtotal">-</span></div>
                    <div class="total-linea"><span>Envío</span><span>Gratis</span></div>
                    <div class="total-final"><span>Total</span><span id="total-final">-</span></div>
                </div>
                <button onclick="realizarPedido()" style="width:100%;margin-top:1rem">
                    🔒 Confirmar pedido
                </button>
                <p style="color:#aaa;font-size:0.8rem;text-align:center;margin-top:0.75rem">
                    🔒 Pago seguro simulado
                </p>
            </div>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) window.location.href = "login";

async function init() {
    const res = await fetch("/api/tienda/carrito", { headers: { "Authorization": `Bearer ${token}` } });
    const data = await res.json();
    const items = data.items || [];

    if (items.length === 0) { window.location.href = "tienda"; return; }

    document.getElementById("subtotal").textContent = `${data.total}€`;
    document.getElementById("total-final").textContent = `${data.total}€`;

    document.getElementById("resumen-items").innerHTML = items.map(item => `
        <div class="resumen-item">
            <div class="resumen-img">
                ${item.imagen_url ? `<img src="${item.imagen_url}" onerror="this.parentElement.innerHTML='📦'">` : "📦"}
            </div>
            <div style="flex:1">
                <div style="font-size:0.9rem;font-weight:bold">${item.nombre}</div>
                <div style="color:#aaa;font-size:0.8rem">x${item.cantidad}</div>
            </div>
            <div style="color:#e94560;font-weight:bold">${(item.precio * item.cantidad).toFixed(2)}€</div>
        </div>
    `).join("");
}

document.getElementById("num-tarjeta").addEventListener("input", function() {
    let val = this.value.replace(/\D/g, "").substring(0, 16);
    this.value = val.match(/.{1,4}/g)?.join(" ") || val;
});

document.getElementById("expiracion").addEventListener("input", function() {
    let val = this.value.replace(/\D/g, "").substring(0, 4);
    if (val.length >= 3) val = val.substring(0, 2) + "/" + val.substring(2);
    this.value = val;
});

async function realizarPedido() {
    const nombre = document.getElementById("nombre-envio").value;
    const direccion = document.getElementById("direccion").value;
    const ciudad = document.getElementById("ciudad").value;
    const cp = document.getElementById("cp").value;
    const pais = document.getElementById("pais").value;
    const num = document.getElementById("num-tarjeta").value.replace(/\s/g, "");
    const titular = document.getElementById("titular").value;
    const exp = document.getElementById("expiracion").value;
    const cvv = document.getElementById("cvv").value;
    const msg = document.getElementById("mensaje");

    if (!nombre || !direccion || !ciudad || !cp || !pais) {
        msg.className = "mensaje error"; msg.textContent = "Rellena todos los datos de envío"; return;
    }
    if (num.length !== 16) { msg.className = "mensaje error"; msg.textContent = "Número de tarjeta inválido"; return; }
    if (!titular) { msg.className = "mensaje error"; msg.textContent = "Introduce el titular de la tarjeta"; return; }
    if (!/^\d{2}\/\d{2}$/.test(exp)) { msg.className = "mensaje error"; msg.textContent = "Fecha de expiración inválida"; return; }
    if (cvv.length < 3) { msg.className = "mensaje error"; msg.textContent = "CVV inválido"; return; }

    const btn = document.querySelector("button[onclick='realizarPedido()']");
    btn.disabled = true;
    btn.textContent = "⏳ Procesando...";

    await new Promise(r => setTimeout(r, 1500));

    const direccionCompleta = `${nombre}, ${direccion}, ${ciudad} ${cp}, ${pais}`;
    const res = await fetch("/api/tienda/pedidos", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ direccion_envio: direccionCompleta })
    });
    const data = await res.json();

    if (res.ok) {
        localStorage.setItem("ultimo-pedido", data.id_pedido);
        window.location.href = "pedido-exitoso";
    } else {
        msg.className = "mensaje error";
        msg.textContent = data.error;
        btn.disabled = false;
        btn.textContent = "🔒 Confirmar pedido";
    }
}

init();
</script>
<script src="nav.js"></script>
<script>initNav();</script>
</body>
</html>
